function isWeekendOrHoliday(dateStr) {
  const d = new Date(dateStr);
  const dow = d.getDay();
  return dow === 0 || dow === 6 || HOLIDAYS.has(dateStr);
}

function calcWorkingDays(start, end) {
  let count = 0;
  const cur = new Date(start);
  const endDate = new Date(end);
  while (cur <= endDate) {
    const ds = cur.toISOString().slice(0,10);
    if (!isWeekendOrHoliday(ds)) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

async function dbLoad(table) {
  const { data, error } = await sb.from(table).select("*");
  if (error) { console.error(error); return []; }
  return data.map(r => {
    if (table === "attendance") return { id: r.id, empId: r.emp_id, date: r.date, clockIn: r.clock_in, clockOut: r.clock_out };
    if (table === "leaves") return { id: r.id, empId: r.emp_id, empName: r.emp_name, startDate: r.start_date, endDate: r.end_date, reason: r.reason, leaveType: r.leave_type, halfType: r.half_type, status: r.status, appliedAt: r.applied_at, startHalf: r.start_half||false, endHalf: r.end_half||false };
    if (table === "company_events") return { id: r.id, title: r.title, type: r.type, startDate: r.start_date, endDate: r.end_date, color: r.color };
    return r;
  });
}

async function dbUpsert(table, item) {
  let row;
  if (table === "attendance") row = { id: item.id, emp_id: item.empId, date: item.date, clock_in: item.clockIn, clock_out: item.clockOut };
  else if (table === "leaves") row = { id: item.id, emp_id: item.empId, emp_name: item.empName, start_date: item.startDate, end_date: item.endDate, reason: item.reason, leave_type: item.leaveType, half_type: item.halfType, status: item.status, applied_at: item.appliedAt, start_half: item.startHalf||false, end_half: item.endHalf||false };
  else if (table === "company_events") row = { id: item.id, title: item.title, type: item.type, start_date: item.startDate, end_date: item.endDate, color: item.color };
  const { error } = await sb.from(table).upsert(row, { onConflict: "id" });
  if (error) console.error("upsert error:", table, error);
}

async function dbUpdate(table, id, fields) {
  const { error } = await sb.from(table).update(fields).eq("id", id);
  if (error) console.error("update error:", table, error);
}

async function dbDelete(table, id) {
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) console.error(error);
}

function calcUsedLeave(leaves, empId) {
  return leaves.filter(l => l.empId === empId && l.status === "approved")
    .reduce((sum, l) => {
      if (l.leaveType === "반차") return sum + 0.5;
      let d = calcWorkingDays(l.startDate, l.endDate);
      if (l.startHalf) d -= 0.5;
      if (l.endHalf) d -= 0.5;
      return sum + Math.max(d, 0);
    }, 0);
}

                <div style={{fontWeight:800,fontSize:16}}>{fmt(selectedDay)}</div>

              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>

                {sEvents.map(e => <div key={e.id} style={{background:C.card,borderRadius:12,padding:"12px 16px",borderLeft:`4px solid ${e.color}`}}>

                  <div style={{fontSize:12,color:C.sub}}>{l.leaveType==="반차"?"0.5일":diffDays(l.startDate,l.endDate)+"일"}</div>
                </div>)}
                {sPersonal.map(pe => <div key={pe.id} style={{background:"#f0fff4",borderRadius:12,padding:"12px 16px",borderLeft:"4px solid #2d8a4e"}}>
                  <div style={{fontWeight:700,fontSize:14,color:"#2d8a4e"}}>📌 {pe.title}{pe.empName?` (${pe.empName})`:""}</div>
                  <div style={{fontSize:12,color:C.sub}}>개인일정</div>
                </div>)}
                {sBdays.map((emp,idx) => <div key={"sbd"+idx} style={{background:"#fff0f8",borderRadius:12,padding:"12px 16px",borderLeft:"4px solid #c2185b"}}>
                  <div style={{fontWeight:700,fontSize:14,color:"#c2185b"}}>🎂 {emp.name} 생일</div>
                  <div style={{fontSize:12,color:C.sub}}>생일 축하해요 🎉</div>
                </div>)}
                {!sHoliday && sLeaves.length===0 && sEvents.length===0 && sPersonal.length===0 && sBdays.length===0 &&
                  <div style={{textAlign:"center",color:C.sub,fontSize:13,padding:16}}>일정이 없어요</div>}
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function CompanyEventManager({ companyEvents, setCompanyEvents, showToast }) {

  const addEvent = async () => {
    if (!form.title.trim()) { showToast("일정 이름을 입력해주세요!"); return; }
    const ev = { id:Date.now(), ...form };
    await dbUpsert("company_events", ev);
    setCompanyEvents(prev => [...prev, ev]);
    setForm({ title:"", type:"팝업", startDate:todayStr(), endDate:todayStr(), color:EVENT_COLORS[0] });
    showToast("📌 일정이 추가됐어요!");
  };
  const deleteEvent = async (id) => {
    await dbDelete("company_events", id);
    setCompanyEvents(prev => prev.filter(e => e.id !== id));
    showToast("🗑 일정이 삭제됐어요.");
  };
  const inp = (extra={}) => ({display:"block",width:"100%",padding:"11px 14px",borderRadius:10,border:`1px solid ${C.border}`,fontSize:14,boxSizing:"border-box",outline:"none",...extra});

        <input value={form.title} onChange={e => setForm(f=>({...f,title:e.target.value}))} placeholder="예: 봄 할인행사"
          style={{...inp(),marginTop:6,marginBottom:14}} />
        <label style={{fontSize:13,color:C.sub,fontWeight:700}}>종류</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6,marginBottom:14}}>
          {EVENT_TYPES.map(t => <button key={t} onClick={() => setForm(f=>({...f,type:t}))}
            style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,
              background:form.type===t?C.primary:C.bg,color:form.type===t?"#fff":C.sub,fontWeight:form.type===t?700:400}}>{t}</button>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div><label style={{fontSize:13,color:C.sub,fontWeight:700}}>시작일</label>
            <input type="date" value={form.startDate} onChange={e => setForm(f=>({...f,startDate:e.target.value}))} style={{...inp(),marginTop:6,padding:"10px 12px",fontSize:13}} /></div>
          <div><label style={{fontSize:13,color:C.sub,fontWeight:700}}>종료일</label>
            <input type="date" value={form.endDate} onChange={e => setForm(f=>({...f,endDate:e.target.value}))} style={{...inp(),marginTop:6,padding:"10px 12px",fontSize:13}} /></div>
        </div>
        <label style={{fontSize:13,color:C.sub,fontWeight:700}}>색상</label>
        <div style={{display:"flex",gap:8,marginTop:6,marginBottom:16}}>
          {EVENT_COLORS.map(c => <div key={c} onClick={() => setForm(f=>({...f,color:c}))}
            style={{width:28,height:28,borderRadius:"50%",background:c,cursor:"pointer",
              border:form.color===c?`3px solid ${C.text}`:"3px solid transparent"}} />)}
        </div>
        <button onClick={addEvent} style={{...btn(C.primary),width:"100%",padding:"13px"}}>일정 추가하기 +</button>
      </div>
      <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>등록된 일정</div>
      {companyEvents.length === 0
        ? <div style={{background:C.card,borderRadius:14,padding:32,textAlign:"center",color:C.sub}}>등록된 일정이 없어요</div>
        : <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {[...companyEvents].sort((a,b)=>a.startDate.localeCompare(b.startDate)).map(e => (
              <div key={e.id} style={{background:C.card,borderRadius:12,padding:"14px 16px",borderLeft:`4px solid ${e.color}`,
                display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 6px #0001"}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14}}>{e.title}</div>
                  <div style={{fontSize:12,color:C.sub,marginTop:2}}>{e.type} · {fmt(e.startDate)}{e.startDate!==e.endDate?` ~ ${fmt(e.endDate)}`:""}</div>
                </div>
                <button onClick={() => deleteEvent(e.id)} style={{...btn(C.redLight,C.red),fontSize:12,padding:"6px 12px"}}>삭제</button>

            ))}
          </div>}
    </div>
  );
}

function EmployeeScreen({ user, employees, attendance, setAttendance, leaves, setLeaves, companyEvents, personalEvents, setPersonalEvents, onLogout }) {
  const [tab, setTab] = useState("home");
  const [leaveForm, setLeaveForm] = useState({ startDate:todayStr(), endDate:todayStr(), reason:"", leaveType:"연차", halfType:"오전", startHalf:false, startHalfType:"오전", endHalf:false, endHalfType:"오후" });
  const [toast, setToast] = useState("");
  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(""),2500); };
  const todayRec = attendance.find(a => a.empId===user.id && a.date===todayStr());
  const usedLeave = calcUsedLeave(leaves, user.id);
  const remainLeave = user.totalLeave - usedLeave;
  const myLeaves = leaves.filter(l => l.empId===user.id).sort((a,b)=>b.id-a.id);
  const approvedLeaves = leaves.filter(l => l.status==="approved");
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthRecs = attendance.filter(a => a.empId===user.id && a.date.startsWith(thisMonth));

  const calcHours = (ci, co) => {
    if (!ci||!co) return "-";
    const [h1,m1]=ci.split(":").map(Number); const [h2,m2]=co.split(":").map(Number);
    const mins=(h2*60+m2)-(h1*60+m1);
    return `${Math.floor(mins/60)}시간 ${mins%60}분`;
  };

  const clockIn = async () => {
    if (todayRec?.clockIn) return;
    const rec = { id:Date.now(), empId:user.id, date:todayStr(), clockIn:nowTime(), clockOut:null };
    await dbUpsert("attendance", rec);
    setAttendance(prev => [...prev, rec]);
    showToast("✅ 출근 완료!");
  };
  const cancelClockIn = async () => {
    if (!todayRec || todayRec.clockOut) return;
    await dbDelete("attendance", todayRec.id);
    setAttendance(prev => prev.filter(a => a.id !== todayRec.id));
    showToast("↩️ 출근 취소됐어요.");
  };
  const clockOut = async () => {
    if (!todayRec?.clockIn||todayRec?.clockOut) return;
    const t = nowTime();
    await dbUpdate("attendance", todayRec.id, { clock_out: t });
    setAttendance(prev => prev.map(a => a.id===todayRec.id ? {...a, clockOut:t} : a));
    showToast("👋 퇴근 완료!");
  };
  const cancelClockOut = async () => {
    if (!todayRec?.clockOut) return;
    await dbUpdate("attendance", todayRec.id, { clock_out: null });
    setAttendance(prev => prev.map(a => a.id===todayRec.id ? {...a, clockOut:null} : a));
    showToast("↩️ 퇴근 취소됐어요.");
  };
  const applyLeave = async () => {
    let days;
    if (leaveForm.leaveType === "반차") {
      days = 0.5;
    } else {
      days = calcWorkingDays(leaveForm.startDate, leaveForm.endDate);
      if (leaveForm.startHalf) days -= 0.5;
      if (leaveForm.endHalf) days -= 0.5;
    }
    if (days <= 0) { showToast("❌ 선택한 기간에 영업일이 없어요!"); return; }
    if (!user.unlimited && days > remainLeave) { showToast("❌ 남은 휴가가 부족해요!"); return; }
    const rec = { id:Date.now(), empId:user.id, empName:user.name, ...leaveForm, status:"pending", appliedAt:todayStr() };
    await dbUpsert("leaves", rec);
    setLeaves(prev => [...prev, rec]);
    setLeaveForm({ startDate:todayStr(), endDate:todayStr(), reason:"", leaveType:"연차", halfType:"오전", startHalf:false, startHalfType:"오전", endHalf:false, endHalfType:"오후" });
    showToast("📋 휴가 신청 완료! 승인 대기 중이에요."); setTab("leave");
  };
  const cancelLeave = async (id) => {
    await dbDelete("leaves", id);
    setLeaves(prev => prev.filter(l => l.id!==id));
    showToast("🗑 신청이 취소됐어요.");
  };

  const statusBadge = (s) => {
    const map = { pending:["대기중",C.yellow,C.yellowLight], approved:["승인됨",C.green,C.greenLight], rejected:["반려됨",C.red,C.redLight] };
    const [label,color,bg] = map[s]||["?",C.sub,C.bg];
    return <span style={{fontSize:12,fontWeight:700,color,background:bg,padding:"3px 10px",borderRadius:20}}>{label}</span>;
  };

  const TABS = [{k:"home",label:"🏠 홈"},{k:"apply",label:"✉️ 휴가신청"},{k:"leave",label:"📋 내 휴가"},{k:"calendar",label:"📅 팀 캘린더"}];

  return (
    <div style={{minHeight:"100vh",background:C.bg}}>
      <Toast msg={toast} />
      <div style={{background:C.primary,padding:"20px 20px 16px",color:"#fff"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:12,opacity:0.8}}>안녕하세요 👋</div>
            <div style={{fontSize:20,fontWeight:800}}>{user.name}님</div>
          </div>
          <button onClick={onLogout} style={{...btn("rgba(255,255,255,0.2)","#fff"),fontSize:12,padding:"6px 14px"}}>로그아웃</button>
        </div>
      </div>
      <div style={{background:C.card,borderBottom:`1px solid ${C.border}`,display:"flex",overflowX:"auto"}}>
        {TABS.map(t => <button key={t.k} onClick={()=>setTab(t.k)}
          style={{flex:1,padding:"12px 8px",border:"none",background:"none",cursor:"pointer",fontSize:12,fontWeight:700,whiteSpace:"nowrap",
            color:tab===t.k?C.primary:C.sub,borderBottom:tab===t.k?`2px solid ${C.primary}`:"2px solid transparent"}}>{t.label}</button>)}
      </div>
      <div style={{padding:16,maxWidth:500,margin:"0 auto"}}>
        {tab==="home" && (
          <div>
            <div style={{background:C.card,borderRadius:16,padding:20,marginBottom:16,boxShadow:"0 1px 8px #0001"}}>
              <div style={{fontSize:13,color:C.sub,marginBottom:4}}>오늘 출퇴근</div>
              <div style={{fontSize:12,color:C.sub,marginBottom:16}}>{new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"})}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                <div style={{background:C.greenLight,borderRadius:12,padding:"14px 16px"}}>
                  <div style={{fontSize:11,color:C.green,fontWeight:700}}>출근</div>
                  <div style={{fontSize:22,fontWeight:800,color:C.text}}>{todayRec?.clockIn||"--:--"}</div>
                </div>
                <div style={{background:C.primaryLight,borderRadius:12,padding:"14px 16px"}}>
                  <div style={{fontSize:11,color:C.primary,fontWeight:700}}>퇴근</div>
                  <div style={{fontSize:22,fontWeight:800,color:C.text}}>{todayRec?.clockOut||"--:--"}</div>
                </div>
              </div>
              {todayRec?.clockIn && todayRec?.clockOut && <div style={{textAlign:"center",fontSize:13,color:C.sub,marginBottom:12}}>근무시간 {calcHours(todayRec.clockIn,todayRec.clockOut)}</div>}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <button onClick={clockIn} disabled={!!todayRec?.clockIn}
                    style={{...btn(todayRec?.clockIn?"#e9ecef":C.green,todayRec?.clockIn?C.sub:"#fff"),padding:"13px"}}>
                    {todayRec?.clockIn?"출근 완료 ✅":"출근하기 ✅"}</button>

                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <button onClick={clockOut} disabled={!todayRec?.clockIn||!!todayRec?.clockOut}

                    {todayRec?.clockOut?"퇴근 완료 👋":"퇴근하기 👋"}</button>
                  {todayRec?.clockOut && (
                    <button onClick={cancelClockOut}
                      style={{...btn(C.redLight,C.red),padding:"7px",fontSize:12}}>퇴근 취소 ↩️</button>
                  )}
                </div>
              </div>
            </div>
            <div style={{background:C.card,borderRadius:16,padding:20,marginBottom:16,boxShadow:"0 1px 8px #0001"}}>
              <div style={{fontSize:13,color:C.sub,marginBottom:12}}>휴가 현황</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                {[["총 휴가",user.unlimited?"무제한":user.totalLeave+"일",C.primary],["사용",usedLeave+"일",C.accent],["잔여",user.unlimited?"∞":remainLeave+"일",C.green]].map(([l,v,c]) => (
                  <div key={l} style={{background:C.bg,borderRadius:12,padding:"12px 10px",textAlign:"center"}}>

            <div style={{background:C.card,borderRadius:16,padding:20,boxShadow:"0 1px 8px #0001"}}>
              <div style={{fontSize:13,color:C.sub,marginBottom:12}}>이번달 근무 기록</div>
              {monthRecs.length===0

                        <div style={{fontSize:13,color:C.sub}}>{r.clockIn} → {r.clockOut||"근무중"}</div>

                      </div>

          </div>

        {tab==="apply" && (

            <div style={{fontSize:16,fontWeight:800,marginBottom:4}}>휴가 신청</div>

            )}

            <label style={{fontSize:13,color:C.sub,fontWeight:700}}>사유 (선택)</label>
            <textarea value={leaveForm.reason} onChange={e => setLeaveForm(f=>({...f,reason:e.target.value}))} placeholder="사유를 입력하세요"
              style={{display:"block",width:"100%",marginTop:6,marginBottom:14,padding:"12px 14px",borderRadius:10,border:`1px solid ${C.border}`,fontSize:14,boxSizing:"border-box",resize:"none",height:60,fontFamily:"inherit"}} />

            <div style={{background:C.primaryLight,borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:14}}>
              차감 일수: <strong style={{color:C.primary}}>
                {leaveForm.leaveType==="반차" ? "0.5일" : (() => {
                  let d = calcWorkingDays(leaveForm.startDate, leaveForm.endDate);
                  if (leaveForm.startHalf) d -= 0.5;
                  if (leaveForm.endHalf) d -= 0.5;
                  return Math.max(d,0) + "일";
                })()}
              </strong>
              <span style={{fontSize:12,color:C.sub,marginLeft:6}}>(주말·공휴일 제외)</span>
            </div>
            <button onClick={applyLeave} style={{...btn(C.primary),width:"100%",padding:"14px"}}>신청하기 →</button>
          </div>
        )}
        {tab==="leave" && (
          <div>
            <div style={{fontSize:16,fontWeight:800,marginBottom:16}}>내 휴가 내역</div>
            {myLeaves.length===0
              ? <div style={{background:C.card,borderRadius:16,padding:40,textAlign:"center",color:C.sub}}>신청한 휴가가 없어요</div>
              : <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {myLeaves.map(l => (
                    <div key={l.id} style={{background:C.card,borderRadius:16,padding:18,boxShadow:"0 1px 8px #0001"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                        <div style={{fontWeight:700,fontSize:15}}>
                          {l.leaveType==="반차" ? fmt(l.startDate) : `${fmt(l.startDate)} ~ ${fmt(l.endDate)}`}
                          {l.leaveType==="반차" && <span style={{marginLeft:8,fontSize:12,background:C.yellowLight,color:C.yellow,padding:"2px 8px",borderRadius:20,fontWeight:700}}>{l.halfType||"오전"}반차</span>}
                        </div>
                        {statusBadge(l.status)}
                      </div>
                      <div style={{fontSize:13,color:C.sub,marginBottom:4}}>
                        {l.leaveType==="반차" ? `반차 (${l.halfType||"오전"}) · 0.5일` : `${calcWorkingDays(l.startDate,l.endDate)}일 (영업일)`} · 신청일 {fmt(l.appliedAt)}
                      </div>
                      {l.reason && <div style={{fontSize:13,color:C.sub}}>{l.reason}</div>}
                      {l.status==="pending" && <button onClick={()=>cancelLeave(l.id)}
                        style={{...btn(C.redLight,C.red),marginTop:10,fontSize:12,padding:"6px 14px"}}>취소하기</button>}
                    </div>
                  ))}
                </div>}
          </div>
        )}
        {tab==="calendar" && (
          <div>
            <PersonalEventForm user={user} personalEvents={personalEvents} setPersonalEvents={setPersonalEvents} />
            <CalendarView leaves={leaves} companyEvents={companyEvents} personalEvents={personalEvents.filter(e=>e.empId===user.id)} employees={employees} />
          </div>
        )}
      </div>
    </div>
  );
}

function PersonalEventForm({ user, personalEvents, setPersonalEvents }) {
  const [form, setForm] = useState({ title:"", date:todayStr(), endDate:todayStr() });
  const [open, setOpen] = useState(false);
  const myEvents = personalEvents.filter(e=>e.empId===user.id).sort((a,b)=>b.date.localeCompare(a.date));
  const add = async () => {
    if (!form.title.trim()) return;
    const ev = { id:Date.now(), empId:user.id, empName:user.name, title:form.title, date:form.date, endDate:form.endDate||form.date };
    await dbUpsert("personal_events", ev);
    setPersonalEvents(prev=>[...prev, ev]);
    setForm({ title:"", date:todayStr(), endDate:todayStr() });
    setOpen(false);
  };
  const del = async (id) => {
    await dbDelete("personal_events", id);
    setPersonalEvents(prev=>prev.filter(e=>e.id!==id));
  };
  const inp = (extra={}) => ({display:"block",width:"100%",padding:"10px 12px",borderRadius:10,border:`1px solid ${C.border}`,fontSize:14,boxSizing:"border-box",outline:"none",...extra});
  return (
    <div style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:14,fontWeight:700}}>📝 내 일정</div>
        <button onClick={()=>setOpen(v=>!v)} style={{...btn(C.primary),fontSize:12,padding:"6px 14px"}}>{open?"닫기":"+ 일정 추가"}</button>
      </div>
      {open && (
        <div style={{background:C.card,borderRadius:14,padding:16,marginBottom:12,boxShadow:"0 1px 8px #0001"}}>
          <input style={inp({marginBottom:8})} placeholder="일정 이름 (예: 반반차, 외부미팅, 행사)" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} />
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <div style={{flex:1}}>
              <div style={{fontSize:12,color:C.sub,marginBottom:4}}>시작일</div>
              <input type="date" style={inp()} value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value,endDate:e.target.value}))} />
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:12,color:C.sub,marginBottom:4}}>종료일</div>
              <input type="date" style={inp()} value={form.endDate} onChange={e=>setForm(f=>({...f,endDate:e.target.value}))} />
            </div>
          </div>
          <button onClick={add} style={{...btn(C.primary),width:"100%"}}>추가하기</button>
        </div>
      )}
      {myEvents.length>0 && (
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {myEvents.map(e=>(
            <div key={e.id} style={{background:C.card,borderRadius:10,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 4px #0001"}}>
              <div>
                <div style={{fontWeight:600,fontSize:13}}>{e.title}</div>
                <div style={{fontSize:11,color:C.sub}}>{fmt(e.date)}{e.date!==e.endDate?` ~ ${fmt(e.endDate)}`:""}</div>
              </div>
              <button onClick={()=>del(e.id)} style={{...btn(C.redLight,C.red),fontSize:11,padding:"4px 10px"}}>삭제</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AdminScreen({ employees, attendance, setAttendance, leaves, setLeaves, companyEvents, setCompanyEvents, personalEvents, onLogout }) {
  const [tab, setTab] = useState("leave");
  const [toast, setToast] = useState("");
  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(""),2500); };
  const pendingLeaves = leaves.filter(l => l.status==="pending").sort((a,b)=>b.id-a.id);
  const approvedLeaves = leaves.filter(l => l.status==="approved");
  const tStr = todayStr();
  const onLeaveToday = approvedLeaves.filter(l => l.startDate<=tStr && l.endDate>=tStr);
  const decide = async (id, status) => {
    await dbUpdate("leaves", id, { status });
    setLeaves(prev => prev.map(l => l.id===id ? {...l, status} : l));
    showToast(status==="approved"?"✅ 승인했어요!":"❌ 반려했어요.");
  };
  const [menuOpen, setMenuOpen] = useState(false);
  const TABS = [{k:"leave",label:"✉️ 휴가 승인"},{k:"status",label:"👥 직원 현황"},{k:"calendar",label:"📅 캘린더"},{k:"attend",label:"🕐 출퇴근"},{k:"events",label:"📌 회사 일정"}];
  const currentTab = TABS.find(t=>t.k===tab);

  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>
      <Toast msg={toast} />
      <div style={{background:"#5c4a35",padding:"16px 20px",color:"#fff"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <button onClick={()=>setMenuOpen(v=>!v)}
              style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"#fff",cursor:"pointer",padding:"6px 10px",fontSize:18,lineHeight:1}}>☰</button>
            <div>
              <div style={{fontSize:12,opacity:0.7}}>관리자 모드 👑</div>
              <div style={{fontSize:20,fontWeight:800}}>최윤정 사장님</div>
            </div>
          </div>
          <button onClick={onLogout} style={{...btn("rgba(255,255,255,0.15)","#fff"),fontSize:12,padding:"6px 14px"}}>로그아웃</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginTop:14}}>
          {[["전체 직원",employees.length+"명","👥"],["오늘 휴가",onLeaveToday.length+"명","🏖️"],["대기 승인",pendingLeaves.length+"건","⏳"]].map(([l,v,ic]) => (
            <div key={l} style={{background:"rgba(255,255,255,0.12)",borderRadius:12,padding:"12px 10px",textAlign:"center"}}>
              <div style={{fontSize:18}}>{ic}</div>
              <div style={{fontSize:18,fontWeight:800}}>{v}</div>
              <div style={{fontSize:11,opacity:0.7}}>{l}</div>
            </div>
          ))}
        </div>
      </div>
      {/* 드로어 오버레이 */}
      {menuOpen && <div onClick={()=>setMenuOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:100}} />}
      {/* 슬라이드 메뉴 */}
      <div style={{position:"fixed",top:0,left:menuOpen?0:-200,width:200,height:"100vh",background:C.card,
        boxShadow:"2px 0 16px #0002",zIndex:101,transition:"left 0.25s ease",display:"flex",flexDirection:"column"}}>
        <div style={{background:"#5c4a35",padding:"20px 16px",color:"#fff"}}>
          <div style={{fontSize:13,opacity:0.8}}>관리자 메뉴 👑</div>
          <div style={{fontSize:17,fontWeight:800,marginTop:2}}>최윤정 사장님</div>
        </div>
        <div style={{flex:1,paddingTop:8}}>
          {TABS.map(t => (
            <button key={t.k} onClick={()=>{setTab(t.k);setMenuOpen(false);}}
              style={{display:"block",width:"100%",border:"none",background:tab===t.k?"#f0ebff":"none",cursor:"pointer",
                padding:"14px 20px",fontSize:13,fontWeight:700,color:tab===t.k?C.primary:C.text,textAlign:"left",
                borderLeft:tab===t.k?`4px solid ${C.primary}`:"4px solid transparent"}}>
              {t.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{flex:1,padding:16}}>
      {currentTab && <div style={{fontSize:13,color:C.sub,marginBottom:12,fontWeight:600}}>{currentTab.label}</div>}
      <div style={{maxWidth:600,margin:"0 auto"}}>
        {tab==="leave" && (
          <div>
            {pendingLeaves.length>0 && (
              <div style={{marginBottom:20}}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:10,color:C.accent}}>⏳ 승인 대기 ({pendingLeaves.length}건)</div>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {pendingLeaves.map(l => (
                    <div key={l.id} style={{background:C.card,borderRadius:16,padding:18,boxShadow:"0 1px 8px #0001",borderLeft:`4px solid ${C.yellow}`}}>
                      <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{l.empName}</div>
                      <div style={{fontSize:14,color:C.sub,marginBottom:4}}>{fmt(l.startDate)} ~ {fmt(l.endDate)} ({diffDays(l.startDate,l.endDate)}일)</div>
                      {l.reason && <div style={{fontSize:13,color:C.sub,marginBottom:10}}>사유: {l.reason}</div>}
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={()=>decide(l.id,"approved")} style={{...btn(C.green),flex:1}}>승인 ✅</button>
                        <button onClick={()=>decide(l.id,"rejected")} style={{...btn(C.red),flex:1}}>반려 ❌</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div>
              <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>전체 휴가 내역</div>
              {leaves.length===0
                ? <div style={{textAlign:"center",color:C.sub,padding:"30px 0"}}>신청 내역이 없어요</div>
                : <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {[...leaves].sort((a,b)=>b.id-a.id).map(l => {
                      const color={approved:C.green,rejected:C.red,pending:C.yellow}[l.status];
                      const label={approved:"승인",rejected:"반려",pending:"대기"}[l.status];
                      return (
                        <div key={l.id} style={{background:C.card,borderRadius:12,padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 6px #0001"}}>
                          <div>
                            <div style={{fontWeight:700,fontSize:14}}>{l.empName}</div>
                            <div style={{fontSize:12,color:C.sub}}>{l.leaveType==="반차"?`${fmt(l.startDate)} (${l.halfType||"오전"}반차)`:`${fmt(l.startDate)} ~ ${fmt(l.endDate)}`}</div>
                          </div>
                          <span style={{fontSize:12,fontWeight:700,color,background:color+"22",padding:"4px 12px",borderRadius:20}}>{label}</span>
                        </div>
                      );
                    })}
                  </div>}
            </div>
          </div>
        )}
        {tab==="status" && (
          <div>
            <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>직원별 휴가 현황</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {employees.map(emp => {
                const used = calcUsedLeave(leaves, emp.id);
                const remain = emp.totalLeave - used;
                const pct = Math.round((used/emp.totalLeave)*100);
                const onLeave = approvedLeaves.some(l => l.empId===emp.id && l.startDate<=tStr && l.endDate>=tStr);
                return (
                  <div key={emp.id} style={{background:C.card,borderRadius:14,padding:"16px 18px",boxShadow:"0 1px 8px #0001"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <div>
                        <span style={{fontWeight:700,fontSize:15}}>{emp.name}</span>
                        {onLeave && <span style={{marginLeft:8,fontSize:11,background:C.greenLight,color:C.green,padding:"2px 8px",borderRadius:20,fontWeight:700}}>휴가중</span>}
                      </div>
                      <div style={{fontSize:12,color:C.sub}}>잔여 <strong style={{color:C.primary}}>{emp.unlimited?"∞":remain+"일"}</strong> / {emp.unlimited?"무제한":emp.totalLeave+"일"}</div>
                    </div>
                    <div style={{background:C.bg,borderRadius:20,height:8,overflow:"hidden"}}>
                      <div style={{width:emp.unlimited?"100%":pct+"%",height:"100%",background:emp.unlimited?C.primary:pct>70?C.red:pct>40?C.yellow:C.green,borderRadius:20,transition:"width 0.5s"}} />
                    </div>
                    <div style={{fontSize:11,color:C.sub,marginTop:4}}>사용 {used}일{emp.unlimited?"":` (${pct}%)`}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {tab==="attend" && (
          <div>
            <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>오늘 출퇴근 현황</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {employees.map(emp => {
                const rec = attendance.find(a => a.empId===emp.id && a.date===tStr);
                return (
                  <div key={emp.id} style={{background:C.card,borderRadius:12,padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 6px #0001"}}>
                    <div style={{fontWeight:600,fontSize:14}}>{emp.name}</div>
                    <div style={{textAlign:"right"}}>
                      {rec ? (
                        <div>
                          <div style={{fontSize:13}}><span style={{color:C.green}}>▶ {rec.clockIn}</span>{rec.clockOut && <span style={{color:C.sub}}> → {rec.clockOut}</span>}</div>
                          <div style={{fontSize:11,color:C.sub}}>{rec.clockOut?"퇴근 완료":"근무 중 🟢"}</div>
                        </div>
                      ) : <span style={{fontSize:12,color:C.sub}}>미출근</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {tab==="calendar" && <CalendarView leaves={leaves} companyEvents={companyEvents} personalEvents={personalEvents} employees={employees} />}
        {tab==="events" && <CompanyEventManager companyEvents={companyEvents} setCompanyEvents={setCompanyEvents} showToast={showToast} />}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(() => loadState("currentUser", null));
  const [employees] = useState(INITIAL_EMPLOYEES);
  const [attendance, setAttendance] = useState([]);
  const [leaves, setLeaves] = useState([]);
  const [companyEvents, setCompanyEvents] = useState([]);
  const [personalEvents, setPersonalEvents] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    async function fetchAll() {
      const [att, lev, evt, pevt] = await Promise.all([
        dbLoad("attendance"), dbLoad("leaves"), dbLoad("company_events"), dbLoad("personal_events"),
      ]);
      setAttendance(att); setLeaves(lev); setCompanyEvents(evt); setPersonalEvents(pevt);
      setLoading(false);
    }
    fetchAll();
    // 10초마다 자동 새로고침 (실시간 동기화)
    const timer = setInterval(async () => {
      const [att, lev, evt, pevt] = await Promise.all([
        dbLoad("attendance"), dbLoad("leaves"), dbLoad("company_events"), dbLoad("personal_events"),
      ]);
      setAttendance(att); setLeaves(lev); setCompanyEvents(evt); setPersonalEvents(pevt);
    }, 10000);
    return () => clearInterval(timer);
  }, []);

  const login = (u) => { setUser(u); saveState("currentUser", u); };
  const logout = () => { setUser(null); saveState("currentUser", null); };

  if (loading) return (
    <div style={{minHeight:"100vh",background:"#f5f0e8",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
      <div style={{fontSize:36}}>🏢</div>
      <div style={{fontSize:16,fontWeight:700,color:"#8b7355"}}>DYNA team</div>
      <div style={{fontSize:13,color:"#9e8e7e"}}>데이터 불러오는 중...</div>
    </div>
  );

  if (!user) return <LoginScreen employees={employees} onLogin={login} />;
  if (user.role==="admin") return <AdminScreen employees={employees} attendance={attendance} setAttendance={setAttendance} leaves={leaves} setLeaves={setLeaves} companyEvents={companyEvents} setCompanyEvents={setCompanyEvents} personalEvents={personalEvents} onLogout={logout} />;
  return <EmployeeScreen user={user} employees={employees} attendance={attendance} setAttendance={setAttendance} leaves={leaves} setLeaves={setLeaves} companyEvents={companyEvents} personalEvents={personalEvents} setPersonalEvents={setPersonalEvents} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
